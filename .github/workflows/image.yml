# Builds the image the home server (the Mac mini, linux/amd64) runs and pushes
# it to ghcr.io. The server never builds; it only pulls what this produces.
#
# This stops at the push. The server's auto-update job pulls `latest` every
# 5 minutes, because nothing on the internet can open a connection to it.

name: Build image

on:
  push:
    branches: [main]
  # Lets a build be started by hand, to rebuild without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # A native x86 runner: the Mac mini is amd64. (It moved off the arm64 Pi
    # on 2026-11-24.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The built-in token is enough to push to this repository's own package,
      # so there is no long-lived registry secret to store or rotate.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Read back by /api/health, so the status page can compare what the
          # server runs with what is on main.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # `latest` is what the server pulls by default. The commit tag is the
          # rollback: point the server's TALKTODATA_TAG at the last good commit.
          tags: |
            ghcr.io/rutwikpatel13/talktodata:latest
            ghcr.io/rutwikpatel13/talktodata:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
